</style></head><body><p><!DOCTYPE html></p><p><html></p><p><head></p><p><style></p><p>/* The container wrapping all 5 cards into a unified row */</p><p>.card-row {</p><p>  display: flex;</p><p>  flex-direction: row;</p><p>  justify-content: center; /* Centers the whole row on the page */</p><p>  align-items: center;</p><p>  gap: 20px;               /* Clean spacing gaps between each card */</p><p>  padding: 20px;</p><p>  width: 100%;</p><p>  box-sizing: border-box;</p><p>  </p><p>  /* Optional: allows cards to wrap to a new line on small mobile screens */</p><p>  flex-wrap: wrap; </p><p>}</p><p></p><p>/* Your updated square card component */</p><p>.card {</p><p>  /* Keeps the card square, scaling dynamically up to a limit */</p><p>  width: 100%;</p><p>  max-width: 200px; </p><p>  aspect-ratio: 1 / 1; </p><p>  </p><p>  border-radius: 16px; </p><p>  background-color: #0000ff; </p><p>  color: #ffffff;            </p><p>  padding: 20px;</p><p>  box-sizing: border-box;</p><p>  </p><p>  display: flex;</p><p>  flex-direction: column;</p><p>  justify-content: center;</p><p>  align-items: center;</p><p>  text-align: center;</p><p>  </p><p>  transition: background-color 0.2s ease, transform 0.2s ease;</p><p>  cursor: pointer;</p><p>}</p><p></p><p>.card:hover {</p><p>  background-color: #3333ff; </p><p>  transform: translateY(-4px); </p><p>}</p><p></p><p>.card h3, </p><p>.card p {</p><p>  color: #ffffff;</p><p>  margin: 4px 0;</p><p>}</p><p></p><p>.card p {</p><p>  font-size: 0.9rem;</p><p>  opacity: 0.9;</p><p>}</p><p></style></p><p></head></p><p><body></p><p><div style="text-align: center; height: 25vh; width: 100vw;"></p><p><h1></p><p>Liam's Page</p><p></h1></p><p></div></p><p></p><p><div class="card-row"></p><p><a href="https://leeyamsworldweb.pages.dev/"><div class="card">Leeyamsworld - The World of Liam Galeon</div></a></p><p><a href="https://youtube.com/"><div class="card">YouTube</div></a></p><p><a href="https://facebook.com/"><div class="card">Facebook</div></a></p><p
