<!DOCTYPE html>

<style>
/* The container wrapping all 5 cards into a unified row */
.card-row {
  display: flex;
  flex-direction: row;
  justify-content: center; /* Centers the whole row on the page */
  align-items: center;
  gap: 20px;               /* Clean spacing gaps between each card */
  padding: 20px;
  width: 100%;
  box-sizing: border-box;
  
  /* Optional: allows cards to wrap to a new line on small mobile screens */
  flex-wrap: wrap; 
}

/* Your updated square card component */
.card {
  /* Keeps the card square, scaling dynamically up to a limit */
  width: 100%;
  max-width: 200px; 
  aspect-ratio: 2 / 1; 

    border-radius: 16px; 
  background-color: #0000ff; 
  color: #ffffff;            
  padding: 20px;
  box-sizing: border-box;
  
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  
  transition: background-color 0.2s ease, transform 0.2s ease;
  cursor: pointer;

.card:hover {

}
